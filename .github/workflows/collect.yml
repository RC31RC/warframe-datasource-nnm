name: Collect & Publish

on:
  schedule:
    # 静态数据每天 22:17 UTC（北京时间次日 06:17）更新；小时仲裁/紫卡周价格由下游维护。
    - cron: "17 22 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/collect.yml"
      - "src/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "pluto/**"
  workflow_dispatch: {}

permissions:
  contents: write

# 同一默认分支串行发布，避免两次采集互相覆盖或抢占秒级 tag。
concurrency:
  group: collect-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # 秒级 tag 的冲突检查需要完整 tag；默认浅克隆看不到已发布 tag。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate generator
        run: |
          npm run typecheck
          npm test

      # 无本地游戏资源时，Plus/语言表使用 GitHub/CDN -> tmp/cache 降级。
      - name: Collect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          npm run collect 2>&1 | tee "$RUNNER_TEMP/warframe-collect.log"

      - name: Verify
        run: npm run verify

      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collect-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/warframe-collect.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize collection failure
        if: failure()
        shell: bash
        run: |
          {
            echo '### Collection/publishing failed'
            echo 'A scheduled trigger is not evidence of a successful publish. Inspect the failed step and collection log artifact.'
            echo '```text'
            if [ -f "$RUNNER_TEMP/warframe-collect.log" ]; then
              tail -n 100 "$RUNNER_TEMP/warframe-collect.log"
            else
              echo 'Failure happened before collection; inspect the dependency/validation steps.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 仅发布静态成品和既有 cache；不会提交 tmp 下的消费者示范/动态响应。
      - name: Commit and tag regenerated data
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- data/latest tmp/cache
          if git diff --cached --quiet; then
            echo "No changes, skip commit and tag"
          else
            git commit -m "data: regenerate $(date -u +%F)"
            TAG="$(date -u +%Y%m%d%H%M%S)"
            while git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; do
              sleep 1
              TAG="$(date -u +%Y%m%d%H%M%S)"
            done
            git tag "$TAG"
            git push --atomic origin "HEAD:$TARGET_BRANCH" "refs/tags/$TAG"
          fi
